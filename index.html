<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレログ">
<meta name="theme-color" content="#0f766e">
<title>トレログ</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#18212c;--sub:#667284;--line:#e2e6eb;--ac:#0f766e;--ac2:#e3f3f0;--warm:#c2410c;--blue:#2563eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:16px;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h1{font-size:19px;font-weight:700;flex:1}
.ib{width:38px;height:38px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;flex:none}
.ib.sm{width:30px;height:30px;font-size:13px;color:var(--sub)}
.sync{font-size:11px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ch h2{font-size:16px;font-weight:700;flex:1;min-width:0}
.tag{font-size:11px;color:var(--ac);background:var(--ac2);border-radius:9px;padding:2px 8px;flex:none}
.pri{background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:11px;color:var(--sub);font-weight:500;padding-bottom:2px}
.dc{position:relative;aspect-ratio:1;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center}
.dc.on{background:var(--ac);color:#fff;font-weight:700}
.dc.td{box-shadow:inset 0 0 0 2px var(--ink)}
.dc.sel{box-shadow:inset 0 0 0 2px var(--warm)}
.dc i{position:absolute;right:-1px;top:-4px;font-style:normal;font-size:11px;color:var(--warm)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.stats small{display:block;font-size:10.5px;color:var(--sub)}
.stats strong{font-size:16px;font-variant-numeric:tabular-nums}
.sum{list-style:none}
.sum li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sum li span:last-child{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.none{color:var(--sub);font-size:14px;padding:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px;font-weight:700}
.row input{position:absolute;opacity:0;pointer-events:none}
.row i{width:50px;height:30px;border-radius:15px;background:#cdd3db;position:relative;transition:.15s;flex:none}
.row i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.row input:checked+i{background:var(--warm)}
.row input:checked+i:after{left:23px}
.set{display:grid;grid-template-columns:20px 1fr 22px 1fr 18px 62px 30px;align-items:center;gap:5px;padding:5px 0;border-top:1px solid var(--line)}
.set b{color:var(--sub);font-weight:500;font-size:13px}
.set span,.cardio span{font-size:12px;color:var(--sub)}
.set em{font-style:normal;font-size:11.5px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.set input,.cardio input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;font-weight:700;background:#fafbfc;font-variant-numeric:tabular-nums}
.cardio{display:flex;align-items:center;gap:8px}
.cardio input{max-width:120px}
.addset{width:100%;margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:9px;color:var(--ac);font-size:14px;font-weight:700}
.prevbox{margin-top:10px;background:#f4f6f8;border-radius:10px;padding:9px 10px;font-size:13px;color:var(--sub)}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ph span{flex:1;font-weight:700;color:var(--ink);font-size:12.5px}
.ph .mini{background:#fff}
.ph .cp{color:var(--ac);border-color:var(--ac);font-weight:700}
.pl{font-variant-numeric:tabular-nums;line-height:1.7}
.pd{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);font-weight:700;color:var(--ink);font-size:12.5px}
.ops{display:flex;gap:6px;flex:none}
.mini{font-size:12px;color:var(--sub);padding:4px 7px;border:1px solid var(--line);border-radius:8px;flex:none}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--ac);color:#fff;font-weight:700;border-radius:26px;padding:14px 28px;box-shadow:0 6px 18px rgba(15,118,110,.35);z-index:6}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:7px 14px;font-size:14px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.li{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:13px 2px;border-top:1px solid var(--line);font-size:15.5px}
.li:first-child{border-top:0}
.li small{color:var(--sub);font-size:12px;flex:none}
.li[disabled]{color:#aab2bd}
.del{color:#b91c1c;font-size:13px;border:1px solid #f0c9c9;border-radius:8px;padding:4px 9px;flex:none}
.inl{display:flex;gap:8px;margin-top:10px}
.inl input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fafbfc}
.fld{display:block;margin-bottom:10px;font-size:12px;color:var(--sub)}
.fld input,.fld select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc;color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.hl{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}
.hl strong{width:86px;flex:none;font-size:14px}
.hl span{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.hl em{font-style:normal;font-size:13px;font-variant-numeric:tabular-nums;flex:none;text-align:right}
.hl em small{display:block;color:var(--sub);font-size:11.5px}
.hl.top{align-items:flex-start}
.hl.top span{line-height:1.7;font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:4}
nav button{flex:1;max-width:186px;padding:11px 0 9px;font-size:12px;color:var(--sub)}
nav button.on{color:var(--ac);font-weight:700}
nav button span{display:block;font-size:19px;line-height:1.2}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-a="nav" data-v="home"><span>◉</span>ホーム</button>
  <button data-a="nav" data-v="hist"><span>≡</span>履歴</button>
  <button data-a="nav" data-v="set"><span>⚙</span>設定</button>
</nav>
<script>
// ---- 種目の初期リスト -------------------------------------------------
const CARDIO = "有酸素運動";
const BW = "自重トレーニング";
const MIN_PARTS = [CARDIO, BW];
const PARTS = ["胸","背中","脚","肩","腹筋",CARDIO,BW];
const DEFAULTS = {
  "胸":["ペクトラベル","ベンチプレス","ペックフライ","チェストプレス","スミスマシン・インクラインベンチプレス","ケーブルクロス","ディップス","ダンベルフライ","ダンベルプレス","インクラインダンベルプレス"],
  "背中":["リバースフライ","ラットマシン","プーリーロウ","バーティカルトラクション","デッドリフト","ラットプルダウン","プーリーロー","チンニング（懸垂）","ベントーオーバーロー"],
  "脚":["カーフレイズ","レッグカール","レッグエクステンション","アブダクター","アダクター","プローンレッグカール","スクワット","スミスマシン・バーベルスクワット","レッグプレス"],
  "肩":["サイドレイズ","ショルダープレス"],
  "腹筋":["ロータリートーソー","アブドミナル"],
  "有酸素運動":["ウォーキング　6kg 傾斜3%"],
  "自重トレーニング":["自重トレーニング"]
};

// ---- 保存 -------------------------------------------------------------
const KEY = "torelog_v1";
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.exercises && s.days){ s.dirty = s.dirty || {}; return s; } }catch(e){}
  let id = 1; const ex = [];
  PARTS.forEach(p => DEFAULTS[p].forEach(n => ex.push({id:id++, part:p, name:n})));
  return {exercises:ex, nextId:id, days:{}, dirty:{}, gasUrl:"", token:""};
}
let S = load();
// 既存データに自重トレーニング（分で記録する種目）がなければ追加する
if(!S.exercises.some(e => e.part === BW)){ S.exercises.push({id:S.nextId++, part:BW, name:BW}); save(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ---- 小道具 -----------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const a = s.split("-").map(Number); return new Date(a[0], a[1]-1, a[2]); };
const today = () => ymd(new Date());
const WD = ["日","月","火","水","木","金","土"];
const label = s => { const d = parse(s); return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）"; };
const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
const fmt = n => String(Math.round(n*100)/100);
const rm = (w,r) => (w<=0 || r<=0) ? 0 : (r===1 ? w : w*(1+r/40));
const exOf = id => S.exercises.find(e => e.id === id);
const isCardio = it => Object.prototype.hasOwnProperty.call(it, "min");
const vol = v => v >= 1000 ? (v/1000).toFixed(1)+"t" : fmt(v)+"kg";
const daysAgo = d => Math.round((parse(today()) - parse(d)) / 86400000);
const agoTxt = d => { if(!d) return ""; const n = daysAgo(d); return n <= 0 ? "今日" : n+"日前"; };
const sortedDates = () => Object.keys(S.days).sort();

function stat(day){
  const o = {ex:0, sets:0, reps:0, vol:0, min:0, bw:0};
  if(!day) return o;
  day.items.forEach(it => {
    o.ex++;
    if(isCardio(it)){ const e = exOf(it.id); if(e && e.part === BW) o.bw += num(it.min); else o.min += num(it.min); }
    else it.sets.forEach(s => { const w = num(s.w), r = num(s.r); if(r > 0){ o.sets++; o.reps += r; o.vol += w*r; } });
  });
  return o;
}
function fmtSets(sets){
  const out = []; let last = null, cnt = 0;
  const flush = () => { if(last) out.push(last + (cnt > 1 ? " ×"+cnt : "")); };
  sets.forEach(s => {
    const r = num(s.r); if(r <= 0) return;
    const k = fmt(num(s.w))+"kg×"+fmt(r);
    if(k === last) cnt++; else { flush(); last = k; cnt = 1; }
  });
  flush();
  return out.join("、");
}
function prevOf(id, date){
  const ds = sortedDates();
  for(let i = ds.length-1; i >= 0; i--){
    if(ds[i] >= date) continue;
    const it = S.days[ds[i]].items.find(x => x.id === id);
    if(it) return {date:ds[i], it:it};
  }
  return null;
}
function pastOf(id, date, n){
  const out = [], ds = sortedDates();
  for(let i = ds.length-1; i >= 0 && out.length < n; i--){
    if(ds[i] >= date) continue;
    const it = S.days[ds[i]].items.find(x => x.id === id);
    if(it) out.push({date:ds[i], it:it});
  }
  return out;
}
const doneSets = it => it.sets.filter(s => num(s.r) > 0);
const setLines = it => isCardio(it) ? fmt(num(it.min))+"分" : (doneSets(it).map((s, j) => (j+1)+"）"+fmt(num(s.w))+"kg × "+fmt(num(s.r))+"回").join("<br>") || "—");
const repsOf = it => isCardio(it) ? 0 : doneSets(it).reduce((a, s) => a + num(s.r), 0);
function prevBox(it, i, d){
  const open = V.openHist === it.id, past = pastOf(it.id, d, open ? 6 : 1).filter(p => isCardio(p.it) === isCardio(it));
  if(!past.length) return "";
  return '<div class="prevbox"><div class="ph"><span>前回 '+label(past[0].date)+'</span><button class="mini" data-a="histToggle" data-id="'+it.id+'">'+(open ? "閉じる" : "履歴")+'</button><button class="mini cp" data-a="copyPrev" data-i="'+i+'">前回をコピー</button></div>'
    + past.map((p, k) => (k > 0 ? '<div class="pd">'+label(p.date)+"</div>" : "")+'<div class="pl">'+setLines(p.it)+"</div>").join("")+"</div>";
}
function lastMap(){
  const ex = {}, part = {};
  sortedDates().forEach(d => S.days[d].items.forEach(it => {
    ex[it.id] = d; const e = exOf(it.id); if(e) part[e.part] = d;
  }));
  return {ex:ex, part:part};
}

// ---- 画面の状態 -------------------------------------------------------
const V = {view:"home", month:new Date(new Date().getFullYear(), new Date().getMonth(), 1), sel:today(), part:"胸", edit:false, htab:"day", hex:null, more:40, openHist:null, syncMsg:""};

function touch(date){
  const day = S.days[date];
  if(day && !day.items.length && !day.sauna) delete S.days[date];
  S.dirty[date] = Date.now();
  save();
  queueSync();
}
function getDay(date){ if(!S.days[date]) S.days[date] = {items:[], sauna:false}; return S.days[date]; }

// ---- ホーム -----------------------------------------------------------
function vHome(){
  const m = V.month, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1).getDay(), n = new Date(y, mo+1, 0).getDate(), t = today();
  let cells = WD.map(w => "<b>"+w+"</b>").join(""), cnt = 0;
  for(let i = 0; i < first; i++) cells += "<span></span>";
  for(let d = 1; d <= n; d++){
    const k = y+"-"+pad(mo+1)+"-"+pad(d), day = S.days[k], cls = ["dc"];
    if(day) cnt++;
    if(day && day.items.length) cls.push("on");
    if(k === t) cls.push("td");
    if(k === V.sel) cls.push("sel");
    cells += '<button class="'+cls.join(" ")+'" data-a="sel" data-d="'+k+'">'+d+(day && day.sauna ? "<i>♨</i>" : "")+"</button>";
  }
  let v7 = 0, v28 = 0, all = 0;
  Object.keys(S.days).forEach(k => { const v = stat(S.days[k]).vol, a = daysAgo(k); all += v; if(a >= 0 && a < 7) v7 += v; if(a >= 0 && a < 28) v28 += v; });

  const day = S.days[V.sel], st = stat(day);
  let body = "";
  if(!day) body = '<p class="none">記録なし</p>';
  else {
    body = '<ul class="sum">' + day.items.map(it => {
      const e = exOf(it.id) || {name:"（削除済み）"};
      return "<li><span>"+esc(e.name)+"</span><span>"+(isCardio(it) ? fmt(num(it.min))+"分" : (fmtSets(it.sets) || "—"))+"</span></li>";
    }).join("") + (day.sauna ? "<li><span>♨ サウナ</span><span>入った</span></li>" : "") + "</ul>";
    body += '<p class="note">'+st.sets+"セット ／ "+st.reps+"レップ ／ 負荷量 "+fmt(st.vol)+"kg"+(st.min ? " ／ 有酸素 "+fmt(st.min)+"分" : "")+(st.bw ? " ／ 自重 "+fmt(st.bw)+"分" : "")+"</p>";
  }
  return '<header class="bar"><h1>トレログ</h1><span class="sync" id="sync">'+esc(V.syncMsg)+"</span></header>"
    + '<section class="card"><div class="ch"><button class="ib" data-a="mon" data-n="-1">‹</button><h2 style="text-align:center">'+y+"年"+(mo+1)+'月</h2><button class="ib" data-a="mon" data-n="1">›</button></div><div class="cal">'+cells+"</div></section>"
    + '<div class="stats"><div><small>今月</small><strong>'+cnt+'日</strong></div><div><small>7日間</small><strong>'+vol(v7)+'</strong></div><div><small>28日間</small><strong>'+vol(v28)+'</strong></div><div><small>累計</small><strong>'+vol(all)+"</strong></div></div>"
    + '<section class="card"><div class="ch"><h2>'+label(V.sel)+(V.sel === t ? "　今日" : "")+'</h2><button class="pri" data-a="open">'+(day ? "編集する" : "記録する")+"</button></div>"+body+"</section>";
}

// ---- 1日の記録 --------------------------------------------------------
const totHtml = st => "<div><small>種目</small><strong>"+st.ex+"</strong></div><div><small>セット</small><strong>"+st.sets+"</strong></div><div><small>レップ</small><strong>"+st.reps+"</strong></div><div><small>負荷量</small><strong>"+fmt(st.vol)+"</strong></div>";
const rmTxt = s => { const v = rm(num(s.w), num(s.r)); return v ? "RM "+fmt(v) : ""; };
function vDay(){
  const d = V.sel, day = S.days[d] || {items:[], sauna:false}, n = day.items.length;
  let h = '<header class="bar"><button class="ib" data-a="nav" data-v="home">‹</button><h1>'+label(d)+'</h1><span class="sync" id="sync">'+esc(V.syncMsg)+"</span></header>"
    + '<div class="stats" id="tot">'+totHtml(stat(day))+"</div>"
    + '<label class="row"><span>♨ サウナに入った</span><input type="checkbox" data-f="sauna"'+(day.sauna ? " checked" : "")+"><i></i></label>";
  day.items.forEach((it, i) => {
    const e = exOf(it.id) || {name:"（削除済み）", part:""};
    let b;
    if(isCardio(it)){
      b = '<div class="cardio"><input type="number" inputmode="decimal" data-f="min" data-i="'+i+'" value="'+esc(it.min)+'" placeholder="0"><span>分</span></div>';

    } else {
      b = it.sets.map((s, j) => '<div class="set"><b>'+(j+1)+'</b><input type="number" inputmode="decimal" step="0.5" data-f="w" data-i="'+i+'" data-j="'+j+'" value="'+esc(s.w)+'" placeholder="0"><span>kg</span><input type="number" inputmode="numeric" data-f="r" data-i="'+i+'" data-j="'+j+'" value="'+esc(s.r)+'" placeholder="0"><span>回</span><em id="rm'+i+"_"+j+'">'+rmTxt(s)+'</em><button class="ib sm" data-a="delSet" data-i="'+i+'" data-j="'+j+'">✕</button></div>').join("");
      b += '<button class="addset" data-a="addSet" data-i="'+i+'">＋ セットを追加</button>';

    }
    b += prevBox(it, i, d);
    h += '<section class="card"><div class="ch"><h2>'+esc(e.name)+"</h2>"
      + (i > 0 ? '<button class="mini" data-a="mv" data-i="'+i+'" data-n="-1">▲</button>' : "")
      + (i < n-1 ? '<button class="mini" data-a="mv" data-i="'+i+'" data-n="1">▼</button>' : "")
      + '<button class="mini" data-a="delItem" data-i="'+i+'">削除</button></div>'+b+"</section>";
  });
  if(!n) h += '<p class="none" style="text-align:center;padding:24px 0">下のボタンから種目を追加してください</p>';
  return h + '<button class="fab" data-a="pick">＋ 種目を追加</button>';
}
function refreshNumbers(i, j){
  const day = S.days[V.sel]; if(!day) return;
  const t = $("#tot"); if(t) t.innerHTML = totHtml(stat(day));
  if(j !== undefined){ const el = $("#rm"+i+"_"+j); if(el) el.textContent = rmTxt(day.items[i].sets[j]); }
}

// ---- 種目を選ぶ -------------------------------------------------------
function vPick(){
  const p = V.part, lm = lastMap(), day = S.days[V.sel];
  const used = new Set((day ? day.items : []).map(i => i.id));
  const list = S.exercises.filter(e => e.part === p && !e.hidden);
  return '<header class="bar"><button class="ib" data-a="nav" data-v="day">‹</button><h1>種目を選択</h1><button class="ghost" data-a="edit">'+(V.edit ? "完了" : "並び替え・削除")+"</button></header>"
    + '<div class="chips">'+PARTS.map(x => '<button data-a="part" data-p="'+x+'"'+(x === p ? ' class="on"' : "")+">"+x+"</button>").join("")+"</div>"
    + '<section class="card"><div class="ch"><h2>'+p+'</h2><span class="tag">'+(lm.part[p] ? "前回 "+agoTxt(lm.part[p]) : "記録なし")+"</span></div>"
    + (list.length ? list.map((e, k) => V.edit
        ? '<div class="li"><span>'+esc(e.name)+'</span><span class="ops">'+(k > 0 ? '<button class="mini" data-a="mvEx" data-id="'+e.id+'" data-n="-1">▲</button>' : "")+(k < list.length-1 ? '<button class="mini" data-a="mvEx" data-id="'+e.id+'" data-n="1">▼</button>' : "")+'<button class="del" data-a="hideEx" data-id="'+e.id+'">削除</button></span></div>'
        : '<button class="li" data-a="choose" data-id="'+e.id+'"'+(used.has(e.id) ? " disabled" : "")+"><span>"+esc(e.name)+"</span><small>"+(used.has(e.id) ? "追加済み" : agoTxt(lm.ex[e.id]))+"</small></button>").join("")
      : '<p class="none">種目がありません</p>')
    + '<div class="inl"><input id="newEx" placeholder="新しい種目名" maxlength="40"><button class="pri" data-a="newEx">追加</button></div></section>';
}

// ---- 履歴 -------------------------------------------------------------
function vHist(){
  let h = '<header class="bar"><h1>履歴</h1></header><div class="chips"><button data-a="htab" data-t="day"'+(V.htab === "day" ? ' class="on"' : "")+'>日別</button><button data-a="htab" data-t="ex"'+(V.htab === "ex" ? ' class="on"' : "")+">種目別</button></div>";
  const ds = sortedDates().reverse();
  if(!ds.length) return h + '<section class="card"><p class="none">まだ記録がありません</p></section>';
  if(V.htab === "day"){
    h += '<section class="card">' + ds.slice(0, V.more).map(d => {
      const day = S.days[d], st = stat(day), parts = [];
      day.items.forEach(it => { const e = exOf(it.id); if(e && parts.indexOf(e.part) < 0) parts.push(e.part); });
      const right = [st.sets ? fmt(st.vol)+"kg" : "", st.min ? fmt(st.min)+"分" : "", st.bw ? "自重"+fmt(st.bw)+"分" : "", day.sauna ? "♨" : ""].filter(Boolean).join(" ") + (st.sets ? "<small>"+st.sets+"セット・"+st.reps+"回</small>" : "");
      return '<button class="hl" data-a="sel" data-d="'+d+'" data-open="1"><strong>'+d.slice(2).replace(/-/g,"/")+"</strong><span>"+esc(parts.join("・") || "サウナのみ")+"</span><em>"+right+"</em></button>";
    }).join("") + "</section>";
    if(ds.length > V.more) h += '<div class="btns" style="justify-content:center"><button class="ghost" data-a="more">もっと見る</button></div>';
    return h;
  }
  const ids = []; ds.forEach(d => S.days[d].items.forEach(it => { if(ids.indexOf(it.id) < 0 && exOf(it.id)) ids.push(it.id); }));
  if(ids.indexOf(V.hex) < 0) V.hex = ids[0];
  const e = exOf(V.hex), pts = [];
  ds.slice().reverse().forEach(d => {
    const it = S.days[d].items.find(x => x.id === V.hex); if(!it) return;
    const v = isCardio(it) ? num(it.min) : Math.max(0, ...it.sets.map(s => rm(num(s.w), num(s.r))));
    pts.push({d:d, v:v, t:setLines(it), reps:repsOf(it)});
  });
  const unit = MIN_PARTS.indexOf(e.part) >= 0 ? "分" : "kg（推定RM）";
  h += '<section class="card"><label class="fld">種目<select data-f="hex">'+ids.map(id => { const x = exOf(id); return '<option value="'+id+'"'+(id === V.hex ? " selected" : "")+">"+esc(x.part+"｜"+x.name)+"</option>"; }).join("")+"</select></label>"+chart(pts, unit)+"</section>";
  h += '<section class="card">' + pts.slice().reverse().slice(0, 60).map(p => '<div class="hl top"><strong>'+p.d.slice(2).replace(/-/g,"/")+"</strong><span>"+p.t+"</span><em>"+(e.part === CARDIO || e.part === BW ? "" : "計"+p.reps+"回<small>RM "+fmt(p.v)+"</small>")+"</em></div>").join("") + "</section>";
  return h;
}
function chart(pts, unit){
  if(pts.length < 2) return '<p class="none">記録が2日分たまるとグラフが出ます（'+unit+"）</p>";
  const W = 320, H = 130, L = 8, R = 8, T = 16, B = 20;
  const vs = pts.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), span = (mx - mn) || 1;
  const x = i => L + (W-L-R) * i / (pts.length-1), y = v => T + (H-T-B) * (1 - (v-mn)/span);
  const line = pts.map((p, i) => x(i).toFixed(1)+","+y(p.v).toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="推移グラフ"><polyline points="'+line+'" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>'
    + pts.map((p, i) => '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="2.6" fill="#0f766e"/>').join("")
    + '<text x="'+L+'" y="'+(H-5)+'" font-size="10" fill="#667284">'+pts[0].d.slice(5).replace("-","/")+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" font-size="10" fill="#667284" text-anchor="end">'+last.d.slice(5).replace("-","/")+"</text>"
    + '<text x="'+L+'" y="11" font-size="10" fill="#667284">最高 '+fmt(mx)+" ／ 最新 "+fmt(last.v)+" "+unit+"</text></svg>";
}

// ---- 設定 -------------------------------------------------------------
function vSet(){
  const nd = Object.keys(S.dirty).length;
  return '<header class="bar"><h1>設定</h1></header>'
    + '<section class="card"><div class="ch"><h2>スプレッドシート連携（GAS）</h2></div>'
    + '<label class="fld">GASのURL（…/exec）<input data-f="gasUrl" value="'+esc(S.gasUrl)+'" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></label>'
    + '<label class="fld">合言葉（GASのTOKENと同じもの）<input data-f="token" value="'+esc(S.token)+'" autocapitalize="off" autocorrect="off"></label>'
    + '<div class="btns"><button class="pri" data-a="ping">接続テスト</button><button class="ghost" data-a="syncAll">全データを送信</button><button class="ghost" data-a="restore">シートから復元</button></div>'
    + '<p class="note" id="setMsg">'+(S.gasUrl ? "未送信 "+nd+"日分。記録すると自動で送信されます。" : "未設定のままでも、この端末内には保存されます。")+"</p></section>"
    + '<section class="card"><div class="ch"><h2>Muse用の接続文</h2></div><div class="btns"><button class="ghost" data-a="copyMuse">コピーする</button></div><p class="note">GASのURLを入れた接続依頼文をコピーします。合言葉は文に含めません。Museの認証情報入力画面で入れてください。</p></section>'
    + '<section class="card"><div class="ch"><h2>バックアップ</h2></div><div class="btns"><button class="ghost" data-a="export">ファイルに書き出す</button><button class="ghost" data-a="import">ファイルから読み込む</button></div><input type="file" id="imp" accept="application/json,.json" class="hide"><p class="note">記録 '+Object.keys(S.days).length+"日分 ／ 種目 "+S.exercises.filter(e => !e.hidden).length+"件</p></section>";
}

// ---- 描画 -------------------------------------------------------------
function render(){
  const v = V.view;
  $("#app").innerHTML = v === "home" ? vHome() : v === "day" ? vDay() : v === "pick" ? vPick() : v === "hist" ? vHist() : vSet();
  $("#nav").className = (v === "day" || v === "pick") ? "hide" : "";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
function go(v){ V.view = v; render(); window.scrollTo(0, 0); }
function setSync(m){ V.syncMsg = m; const el = $("#sync"); if(el) el.textContent = m; }
function setMsg(m){ const el = $("#setMsg"); if(el) el.textContent = m; }

// ---- 操作 -------------------------------------------------------------
const A = {
  nav(d){ V.edit = false; go(d.v); },
  mon(d){ V.month = new Date(V.month.getFullYear(), V.month.getMonth() + Number(d.n), 1); render(); },
  sel(d){ V.sel = d.d; if(d.open) go("day"); else render(); },
  open(){ go("day"); },
  pick(){ go("pick"); },
  part(d){ V.part = d.p; render(); },
  edit(){ V.edit = !V.edit; render(); },
  htab(d){ V.htab = d.t; render(); },
  more(){ V.more += 40; render(); },
  choose(d){
    const id = Number(d.id), e = exOf(id), day = getDay(V.sel), pv = prevOf(id, V.sel);
    if(MIN_PARTS.indexOf(e.part) >= 0) day.items.push({id:id, min:""});
    else { const p = pv && !isCardio(pv.it) && pv.it.sets[0]; day.items.push({id:id, sets:[p ? {w:p.w, r:p.r} : {w:"", r:""}]}); }
    touch(V.sel); go("day"); window.scrollTo(0, document.body.scrollHeight);
  },
  newEx(){
    const el = $("#newEx"), name = el.value.trim(); if(!name) return;
    const dup = S.exercises.find(e => e.part === V.part && e.name === name);
    if(dup) dup.hidden = false; else S.exercises.push({id:S.nextId++, part:V.part, name:name});
    save(); render();
  },
  hideEx(d){ const e = exOf(Number(d.id)); if(e && confirm("「"+e.name+"」を一覧から消しますか？（過去の記録は残ります）")){ e.hidden = true; save(); render(); } },
  addSet(d){ const it = S.days[V.sel].items[d.i], l = it.sets[it.sets.length-1]; it.sets.push(l ? {w:l.w, r:l.r} : {w:"", r:""}); touch(V.sel); render(); },
  delSet(d){ const it = S.days[V.sel].items[d.i]; it.sets.splice(d.j, 1); touch(V.sel); render(); },
  delItem(d){ const day = S.days[V.sel], e = exOf(day.items[d.i].id); if(confirm("「"+(e ? e.name : "この種目")+"」をこの日の記録から消しますか？")){ day.items.splice(d.i, 1); touch(V.sel); render(); } },
  histToggle(d){ const id = Number(d.id); V.openHist = V.openHist === id ? null : id; render(); },
  copyPrev(d){
    const it = S.days[V.sel].items[d.i], pv = prevOf(it.id, V.sel);
    if(!pv || isCardio(pv.it) !== isCardio(it)) return;
    if(isCardio(it)) it.min = pv.it.min;
    else {
      const p0 = pv.it.sets[0] || {}, c0 = it.sets[0] || {};
      const untouched = it.sets.length === 0 || (it.sets.length === 1 && ((!num(c0.w) && !num(c0.r)) || (String(c0.w) === String(p0.w) && String(c0.r) === String(p0.r))));
      if(!untouched && !confirm("入力済みのセットを、前回の内容で置き換えますか？")) return;
      it.sets = doneSets(pv.it).map(s => ({w:s.w, r:s.r}));
      if(!it.sets.length) it.sets = [{w:"", r:""}];
    }
    touch(V.sel); render();
  },
  mvEx(d){
    const e = exOf(Number(d.id)), list = S.exercises.filter(x => x.part === e.part && !x.hidden);
    const o = list[list.indexOf(e) + Number(d.n)]; if(!o) return;
    const a = S.exercises.indexOf(e), b = S.exercises.indexOf(o);
    S.exercises[a] = o; S.exercises[b] = e; save(); render();
  },
  mv(d){ const a = S.days[V.sel].items, i = Number(d.i), j = i + Number(d.n); const t = a[i]; a[i] = a[j]; a[j] = t; touch(V.sel); render(); },
  async ping(){ if(!S.gasUrl) return setMsg("GASのURLを入れてください。"); setMsg("確認中…"); try{ const r = await gas({action:"ping"}); setMsg(r.ok ? "接続できました。" : "つながりましたが拒否されました："+(r.error || "")); }catch(e){ setMsg("接続できません："+e.message); } },
  async syncAll(){ if(!S.gasUrl) return setMsg("GASのURLを入れてください。"); Object.keys(S.days).forEach(d => { S.dirty[d] = Date.now(); }); save(); setMsg("送信中…"); const ok = await syncNow(); setMsg(ok ? "全データを送信しました。" : "送信に失敗しました："+V.syncMsg); },
  async restore(){
    if(!S.gasUrl) return setMsg("GASのURLを入れてください。");
    if(!confirm("シートの内容で、この端末の同じ日付の記録を上書きします。よろしいですか？")) return;
    setMsg("取得中…");
    try{ const r = await gas({action:"all"}); if(!r.ok) throw new Error(r.error || "error"); r.days.forEach(importDay); save(); setMsg(r.days.length+"日分を復元しました。"); }
    catch(e){ setMsg("復元できません："+e.message); }
  },
  copyMuse(){
    const t = "自作の筋トレ記録APIに接続するカスタムコネクタを作ってください。\nエンドポイント: "+(S.gasUrl || "（GASのURL）")+"\n方式: HTTPS の GET。クエリ token に合言葉を付ける（認証情報として別途入力します）。JSONを返します。\n・action=summary … 直近7日/28日の負荷量、有酸素の合計分、サウナ回数、種目別の最高推定RMと最終実施日\n・action=days&from=YYYY-MM-DD&to=YYYY-MM-DD … 期間内の日別記録（種目・セット・重さkg・回数・有酸素の分・サウナ）\n読み取り専用です。接続を試し、結果を見せてからスキルとして保存してください。";
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert("コピーしました。Museのチャットに貼り付けてください。"), () => prompt("コピーしてください", t));
  },
  export(){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
    a.download = "torelog_backup_"+today().replace(/-/g,"")+".json"; document.body.appendChild(a); a.click(); a.remove();
  },
  import(){ $("#imp").click(); }
};
document.addEventListener("click", e => { const t = e.target.closest("[data-a]"); if(t && !t.disabled && A[t.dataset.a]) A[t.dataset.a](t.dataset); });
document.addEventListener("input", e => {
  const t = e.target, f = t.dataset.f; if(!f) return;
  if(f === "gasUrl" || f === "token"){ S[f] = t.value.trim(); save(); return; }
  if(f === "hex"){ V.hex = Number(t.value); render(); return; }
  if(f === "sauna"){ getDay(V.sel).sauna = t.checked; touch(V.sel); return; }
  const day = S.days[V.sel]; if(!day) return;
  const it = day.items[t.dataset.i]; if(!it) return;
  if(f === "min") it.min = t.value; else it.sets[t.dataset.j][f] = t.value;
  touch(V.sel); refreshNumbers(t.dataset.i, t.dataset.j);
});
document.addEventListener("change", e => {
  if(e.target.id !== "imp" || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const s = JSON.parse(fr.result); if(!s.exercises || !s.days) throw new Error("形式が違います");
      if(!confirm("今の記録をすべて、このファイルの内容に置き換えます。よろしいですか？")) return;
      s.gasUrl = S.gasUrl; s.token = S.token; s.dirty = {}; S = s; Object.keys(S.days).forEach(d => { S.dirty[d] = Date.now(); }); save(); render();
    }catch(err){ alert("読み込めませんでした："+err.message); }
  };
  fr.readAsText(e.target.files[0]);
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "newEx") A.newEx(); });

// ---- GAS 同期 ---------------------------------------------------------
async function gas(payload){
  const r = await fetch(S.gasUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({token:S.token}, payload)), redirect:"follow"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function exportDay(d){
  const day = S.days[d]; if(!day) return {date:d, deleted:true};
  return {date:d, sauna:!!day.sauna, items:day.items.map(it => {
    const e = exOf(it.id) || {part:"", name:"（削除済み）"};
    return isCardio(it) ? {part:e.part, name:e.name, min:num(it.min)} : {part:e.part, name:e.name, sets:it.sets.map(s => ({w:num(s.w), r:num(s.r)}))};
  })};
}
function importDay(d){
  if(!d || !d.date) return;
  const items = (d.items || []).map(x => {
    let e = S.exercises.find(q => q.part === x.part && q.name === x.name);
    if(!e){ e = {id:S.nextId++, part:x.part, name:x.name}; S.exercises.push(e); }
    return x.min !== undefined ? {id:e.id, min:x.min || ""} : {id:e.id, sets:(x.sets || []).map(s => ({w:s.w || "", r:s.r || ""}))};
  });
  S.days[d.date] = {items:items, sauna:!!d.sauna};
  delete S.dirty[d.date];
}
let syncT = null, syncing = false;
function queueSync(){ if(!S.gasUrl) return; setSync("未送信"); clearTimeout(syncT); syncT = setTimeout(syncNow, 4000); }
async function syncNow(){
  const dates = Object.keys(S.dirty);
  if(!S.gasUrl || !dates.length) return true;
  if(syncing){ queueSync(); return false; }
  syncing = true; setSync("送信中…");
  const stamp = {}; dates.forEach(d => { stamp[d] = S.dirty[d]; });
  try{
    const r = await gas({action:"save", days:dates.map(exportDay)});
    if(!r.ok) throw new Error(r.error || "error");
    dates.forEach(d => { if(S.dirty[d] === stamp[d]) delete S.dirty[d]; });
    save(); setSync(Object.keys(S.dirty).length ? "未送信" : "送信済み");
    syncing = false; if(Object.keys(S.dirty).length) queueSync();
    return true;
  }catch(e){ syncing = false; setSync("送信失敗（"+e.message+"）"); return false; }
}
window.addEventListener("online", syncNow);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && Object.keys(S.dirty).length){ clearTimeout(syncT); syncNow(); } });

render();
if(S.gasUrl && Object.keys(S.dirty).length) setTimeout(syncNow, 1500);
</script>
</body>
